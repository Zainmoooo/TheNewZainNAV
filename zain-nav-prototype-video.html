<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[Video] Zain Navigation Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* =========================================================================
   Zain Kuwait — Navigation Prototype V1 (Quiet Glass)
   Layout: fixed two-row header (desktop ≥1150px) / compact bar + full-screen
   menu (below 1150px). Tokens below are the single source for both themes.
   Font: Readex Pro is a PLACEHOLDER for the Zain brand font.
   ========================================================================= */
:root{
  --f:"Readex Pro","Segoe UI","Geeza Pro","Noto Sans Arabic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ctx-h:34px; --bar-h:68px; --bar-h-s:56px; --m-bar-h:56px; --m-bar-h-s:52px;
  --ease:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(.2,0,0,1); --ease-sheet:cubic-bezier(.32,.72,0,1);
  --page:#FFFFFF; --s:#FFFFFF; --s2:#F5F1F8; --s3:#ECE5F2; --glass:rgba(255,255,255,.76);--glass-panel:rgba(255,255,255,.92);
  --ink:#22142F; --ink2:#5F5270; --ink3:#776B86; --line:rgba(34,20,47,.10); --line2:rgba(34,20,47,.18);
  --acc:#B81F79; --accbg:rgba(200,36,127,.09); --accfill:#C8247F; --onacc:#FFFFFF; --brand:#4B1E6E;
  --sig:linear-gradient(90deg,#5B2A86 0%,#A02A8B 55%,#D12B8A 100%);
  --focus:#148A92; --curtain:rgba(26,12,38,.32); --card:#F6F2F9; --skel:rgba(34,20,47,.07);
  --shadow:0 18px 40px -20px rgba(34,20,47,.35); --shadow-s:0 8px 24px -16px rgba(34,20,47,.45);
  --menu-bg:#FBF9FD; --pill:#EFE9F4; --pill-ink:#5F5270; --pill-on:#22142F; --pill-on-ink:#FFFFFF;
  --demo:#1F6FEB; --demo-bg:#F3F7FF;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --page:#0F0A14; --s:#150D1C; --s2:#1F1529; --s3:#2A1E36; --glass:rgba(23,14,31,.72);--glass-panel:rgba(23,14,31,.92);
  --ink:#F5EFF9; --ink2:#BDAFCB; --ink3:#9A8BAA; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --acc:#F36BB0; --accbg:rgba(243,107,176,.14); --accfill:#E0489A; --onacc:#FFFFFF; --brand:#CDA6F0;
  --focus:#52D4DC; --curtain:rgba(0,0,0,.56); --card:#22172D; --skel:rgba(255,255,255,.08);
  --shadow:0 18px 40px -18px rgba(0,0,0,.8); --shadow-s:0 8px 24px -14px rgba(0,0,0,.8);
  --menu-bg:#150D1C; --pill:#241A2F; --pill-ink:#BDAFCB; --pill-on:#F5EFF9; --pill-on-ink:#150D1C;
  --demo:#7AB4FF; --demo-bg:#0E1726;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 var(--f);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;flex:none;display:block}
[dir="rtl"] .flip{transform:scaleX(-1)}
.ap{text-decoration:underline dotted;text-decoration-color:var(--acc);text-underline-offset:4px}
html.no-ap .ap{text-decoration:none}
.mock{font:600 9.5px/1 var(--f-mono);letter-spacing:.05em;padding:3px 5px;border-radius:4px;background:#F7E7C2;color:#6E4A00}
html.hide-mock .mock{display:none}
.skip{position:fixed;top:8px;inset-inline-start:8px;z-index:300;background:var(--ink);color:var(--s);padding:8px 14px;border-radius:8px;transform:translateY(-200%)}
.skip:focus{transform:none}
.theming,.theming *{transition:background-color .2s linear,color .2s linear,border-color .2s linear,fill .2s linear!important}
body.lang-fade #app{opacity:.0}
#app{transition:opacity .16s var(--ease)}

/* ============ HEADER ============ */
.zh{position:fixed;top:0;inset-inline:0;z-index:50;transition:transform .28s var(--ease)}
.zh-spacer{height:calc(var(--ctx-h) + var(--bar-h))}
.zh-ctx{height:var(--ctx-h);background:var(--s);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2);transition:opacity .2s var(--ease),visibility 0s linear 0s}
.zh-ctx .in{max-width:1280px;margin:0 auto;height:100%;padding:0 48px;display:flex;align-items:center;gap:20px}
.zh-ctx .sp{flex:1}
.zh-ctx a,.zh-ctx .cbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px;border-radius:6px;white-space:nowrap}
.zh-ctx a:hover,.zh-ctx .cbtn:hover{color:var(--ink)}
.zh-ctx .ic{width:16px;height:16px}
.zh-ctx .lang{font-weight:600;color:var(--ink)}
.seg{display:inline-flex;background:var(--s2);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:3px 12px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--ink2);transition:background-color .2s,color .2s;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--s);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--s3)}
.zh-bar{position:relative;height:var(--bar-h);background:var(--s);transition:height .24s var(--ease),background-color .24s var(--ease),box-shadow .24s var(--ease)}
.zh-in{max-width:1280px;margin:0 auto;height:100%;padding:0 48px;display:flex;align-items:center;gap:clamp(20px,2.6vw,40px)}
.logo{font:700 30px/1 var(--f);letter-spacing:-.035em;color:var(--brand);display:inline-flex;align-items:baseline;gap:2px;flex:none;transition:font-size .24s var(--ease)}
.logo i{width:7px;height:7px;border-radius:50%;background:var(--sig);display:inline-block}
:root[data-theme="dark"] .logo{color:#F5EFF9}
.zh-nav ul{display:flex;gap:2px;align-items:center}
.zh-t{position:relative;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;font-size:15px;font-weight:500;border-radius:10px;white-space:nowrap;color:var(--ink);transition:background-color .16s var(--ease-out)}
.zh-t:hover{background:var(--s2)}
.zh-t::after{content:"";position:absolute;inset-inline:14px;bottom:3px;height:2px;border-radius:2px;background:var(--acc);transform:scaleX(0);transition:transform .24s var(--ease)}
.zh-t[aria-expanded="true"]::after{transform:scaleX(1)}
.zh-t .dot{width:6px;height:6px;border-radius:50%;background:var(--accfill)}
.zh-act{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.ib{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--ink);position:relative;transition:background-color .16s var(--ease-out)}
.ib:hover{background:var(--s2)}
.ib[aria-expanded="true"]{background:var(--s3)}
.badge{position:absolute;top:3px;inset-inline-end:2px;min-width:17px;height:17px;border-radius:999px;background:var(--accfill);color:var(--onacc);font:600 10.5px/17px var(--f);text-align:center;padding:0 4px}
.qp{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px 0 12px;border-radius:999px;background:var(--accbg);color:var(--acc);font-weight:600;font-size:14px;white-space:nowrap;transition:background-color .16s,transform .16s}
.qp:hover{background:color-mix(in srgb,var(--accfill) 16%,transparent)}
.acct{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px 0 12px;border-radius:999px;border:1px solid var(--line2);font-weight:500;font-size:14px;white-space:nowrap;transition:background-color .16s,border-color .16s}
.acct:hover{background:var(--s2)}
.acct[aria-expanded="true"]{background:var(--s2);border-color:var(--ink3)}
.avatar{width:34px;height:34px;border-radius:999px;background:var(--sig);color:#fff;display:grid;place-items:center;font:600 13px var(--f);flex:none}
.acct.in{padding:0;border:0;width:40px;height:40px;justify-content:center;border-radius:999px}
.zh-sig{position:absolute;inset-inline:0;bottom:-1px;height:2px;background:var(--sig);opacity:0;transition:opacity .24s var(--ease)}
.mbtn{display:none}

/* sticky (desktop) */
.zh[data-state="sticky"]{transform:translateY(calc(-1 * var(--ctx-h)))}
.zh[data-state="sticky"] .zh-ctx{opacity:0;visibility:hidden;transition:opacity .16s var(--ease),visibility 0s linear .16s}
.zh[data-state="sticky"] .zh-bar{height:var(--bar-h-s);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 var(--line),0 10px 28px -20px rgba(0,0,0,.4)}
.zh[data-state="sticky"] .zh-sig{opacity:1}
.zh[data-state="sticky"] .logo{font-size:27px}
.zh.panel-open .zh-bar{background:var(--s);-webkit-backdrop-filter:none;backdrop-filter:none}
.zh.panel-open[data-state="sticky"] .zh-bar{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ :root{--glass:rgba(255,255,255,.97)} :root[data-theme="dark"]{--glass:rgba(23,14,31,.97)} }
@media (prefers-reduced-transparency:reduce){ :root{--glass:rgba(255,255,255,.97)} :root[data-theme="dark"]{--glass:rgba(23,14,31,.97)} }

/* ============ MEGA MENU ============ */
.zh-panels{position:absolute;top:100%;inset-inline:0;height:0;overflow:hidden;background:var(--s);transition:height .28s var(--ease),background-color .24s;box-shadow:none}
.zh.panel-open .zh-panels{box-shadow:var(--shadow);border-top:1px solid var(--line)}
.zh[data-state="sticky"] .zh-panels{background:var(--glass-panel);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.mm{position:absolute;top:0;inset-inline:0;opacity:0;visibility:hidden;transition:opacity .12s var(--ease),visibility 0s linear .12s}
.mm.on{position:relative;opacity:1;visibility:visible;transition:opacity .2s var(--ease) .04s,visibility 0s}
.mm-in{max-width:1280px;margin:0 auto;padding:32px 48px 40px;display:grid;gap:0 clamp(24px,3vw,44px);align-items:start}
.mcol{display:grid;gap:22px;align-content:start;min-width:0}
.mm.on .mcol{animation:colIn .28s var(--ease-out) both;animation-delay:calc(var(--i,0) * 22ms + 40ms)}
@keyframes colIn{from{opacity:0;transform:translateY(6px)}}
.grp h3{font:500 12px/1.3 var(--f);color:var(--ink3);letter-spacing:.03em;margin-bottom:10px}
[dir="rtl"] .grp h3{letter-spacing:0;font-size:13px}
.grp h3.sub{margin-top:14px}
.grp a{display:inline-flex;gap:6px;align-items:baseline;padding:4px 0;font-size:14px;line-height:1.35;color:var(--ink);background:linear-gradient(var(--acc),var(--acc)) no-repeat 0 100%/0 1px;transition:background-size .3s var(--ease),color .16s}
[dir="rtl"] .grp a{background-position:100% 100%}
.grp a:hover,.grp a:focus-visible{background-size:100% 1px;color:var(--ink)}
.grp li+li{margin-top:2px}
.grp.big a{font-size:24px;font-weight:600;letter-spacing:-.015em;padding:2px 0;background-size:0 2px}
.grp.big a:hover,.grp.big a:focus-visible{background-size:100% 2px}
[dir="rtl"] .grp.big a{letter-spacing:0;font-size:23px}
.grp.big li+li{margin-top:6px}
.grp.med ul{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,6),auto);column-gap:28px}
.grp.med a{font-size:17px;font-weight:500}
.grp.more a{color:var(--ink2)}
.grp .xa{color:var(--ink3);font-size:.8em}
.grp .note{font-size:12px;color:var(--ink3);margin-top:6px;max-width:34ch}
.feat{display:grid;gap:12px;align-content:start}
.feat .hint{font-size:13px;color:var(--ink2);background:var(--s2);border-radius:12px;padding:12px 14px;display:flex;gap:8px;align-items:center}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

/* offers */
.pf{background:var(--card);border-radius:16px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;transition:transform .2s var(--ease-out),box-shadow .2s}
.pf:hover{transform:translateY(-2px);box-shadow:var(--shadow-s)}
.pf .art{height:150px;display:grid;place-items:center;position:relative}
.pf .art .ic{width:60px;height:60px;color:rgba(255,255,255,.92)}
.pf .bd{padding:16px 18px 18px;display:grid;gap:6px;align-content:start}
.pf h4{font:600 17px/1.3 var(--f)}
.pf p{font-size:13px;color:var(--ink2);line-height:1.45}
.pf .dt{font-size:12px;color:var(--ink3)}
.pf .cta{margin-top:4px;color:var(--acc);font-weight:600;font-size:14px;display:inline-flex;gap:4px;align-items:center}
.pf .cta .ic{width:16px;height:16px}
.pf.compact .art{height:96px}
.pf.noimg{grid-template-rows:1fr}
.pf.noimg .art{display:none}
.bdgs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bdg{font:600 10.5px/1 var(--f);padding:4px 8px;border-radius:999px}
.bdg.fy{background:var(--accbg);color:var(--acc)}
.art.a-plan{background:linear-gradient(135deg,#4B1E6E,#C8247F)} .art.a-device{background:linear-gradient(135deg,#21122E,#5B2A86)}
.art.a-router{background:linear-gradient(135deg,#0E6E78,#3A2C8C)} .art.a-play{background:linear-gradient(135deg,#C8247F,#F08A3C)}
.art.a-gift{background:linear-gradient(135deg,#5B2A86,#23B7C0)} .art.a-tag{background:linear-gradient(135deg,#2B1638,#C8247F)}
.skel{background:var(--skel);border-radius:6px}
@media (prefers-reduced-motion:no-preference){.skel{animation:pulse 1.3s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.45}}

/* curtain */
.curtain{position:fixed;inset:0;z-index:40;background:var(--curtain);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .24s var(--ease),visibility 0s linear .24s}
.curtain.on{opacity:1;visibility:visible;transition:opacity .24s var(--ease),visibility 0s}

/* popovers (account, cart, country) */
.popwrap{position:relative}
.pop{position:absolute;top:calc(100% + 10px);inset-inline-end:0;z-index:60;width:320px;background:var(--s);border-radius:16px;box-shadow:0 0 0 1px var(--line),var(--shadow);padding:16px;display:grid;gap:12px;font-size:14px;transform-origin:top right;opacity:0;visibility:hidden;transform:scale(.97) translateY(-4px);transition:opacity .16s var(--ease),transform .18s var(--ease),visibility 0s linear .18s}
[dir="rtl"] .pop{transform-origin:top left}
.pop.on{opacity:1;visibility:visible;transform:none;transition:opacity .18s var(--ease),transform .18s var(--ease),visibility 0s}
.pop.start{inset-inline-end:auto;inset-inline-start:0;transform-origin:top left;width:240px;padding:8px}
.pop .who{display:flex;gap:10px;align-items:center}
.pop .who small{display:block;color:var(--ink3);font-size:12px}
.pop .hint{color:var(--ink2);font-size:13px}
.pop .eyebrow{font-size:12px;color:var(--ink3)}
.pop .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn1{display:flex;justify-content:center;align-items:center;gap:6px;background:var(--accfill);color:var(--onacc);border-radius:999px;padding:10px 14px;font-weight:600;white-space:nowrap}
.btn2{display:flex;justify-content:center;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:10px 14px;font-weight:500;white-space:nowrap}
.btn1:hover{filter:brightness(1.06)} .btn2:hover{background:var(--s2)}
.pop .list a,.pop .list button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;text-align:start}
.pop .list a:hover,.pop .list button:hover,.pop .list a:focus-visible,.pop .list button:focus-visible{background:var(--s2)}
.pop .list li+li{border-top:1px solid var(--line)}
.pop .list .ic{color:var(--ink3)}
.cnt{background:var(--accbg);color:var(--acc);font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px}
.pop .ctry li{border:0!important}
.pop .ctry button[aria-current="true"]{color:var(--acc);font-weight:600;background:var(--accbg)}
.cartitem{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:4px 0}
.cartitem .th{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#21122E,#5B2A86);display:grid;place-items:center;color:#fff}
.cart-empty{text-align:center;padding:12px 0 4px;color:var(--ink2)}
.legal{font-size:11.5px;color:var(--ink3);text-align:center}

/* search */
.search{position:absolute;top:100%;inset-inline:0;z-index:55;background:var(--s);border-top:1px solid var(--line);box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s var(--ease),transform .22s var(--ease),visibility 0s linear .22s}
.zh[data-state="sticky"] .search{background:var(--glass-panel);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.search.on{opacity:1;visibility:visible;transform:none;transition:opacity .2s var(--ease),transform .24s var(--ease),visibility 0s}
.search-in{max-width:880px;margin:0 auto;padding:26px 48px 34px;display:grid;gap:22px}
.sfield{display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--line2);padding-bottom:10px}
.sfield:focus-within{border-color:var(--acc)}
.sfield input{flex:1;min-width:0;border:0;background:none;font:500 24px/1.3 var(--f);color:var(--ink);outline:none}
.sfield input::placeholder{color:var(--ink3)}
.sfield input::-webkit-search-cancel-button,.sfield input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.sfield .ic{width:22px;height:22px;color:var(--ink3)}
.scancel{display:none}
.sblock h3{font:500 12px var(--f);color:var(--ink3);letter-spacing:.03em;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a,.chips button{font-size:14px;padding:8px 13px;border-radius:999px;border:1px solid var(--line2);white-space:nowrap;transition:background-color .16s,border-color .16s}
.chips a:hover,.chips button:hover{background:var(--s2)}
.sres{display:grid;gap:18px}
.sres .grp-h{font:500 12px var(--f);color:var(--ink3);margin-bottom:4px}
.sres a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;font-size:16px}
.sres a .path{font-size:12px;color:var(--ink3);white-space:nowrap}
.sres a[aria-selected="true"],.sres a:hover{background:var(--s2)}
.sres mark{background:none;color:var(--acc);font-weight:600}
.sempty{color:var(--ink2);font-size:15px}

/* ============ PAGE (sample content) ============ */
.pg{position:relative;overflow:hidden}
.sample-tag{position:absolute;top:14px;inset-inline-end:18px;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.wrapc{max-width:1280px;margin:0 auto;padding-inline:max(24px,env(safe-area-inset-left,0px)) max(24px,env(safe-area-inset-right,0px))}
@media (min-width:1150px){.wrapc{padding-inline:48px}}
.s-hero{background:radial-gradient(120% 140% at 70% 10%,#3B1B57 0%,#120A18 55%,#07040A 100%);color:#fff;padding-block:clamp(56px,10vw,120px)}
.s-hero .wrapc{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.s-hero h1{font:700 clamp(36px,6vw,68px)/1.02 var(--f);letter-spacing:-.03em;text-wrap:balance}
[dir="rtl"] .s-hero h1{letter-spacing:0;line-height:1.15}
.s-hero p{font-size:clamp(16px,1.6vw,20px);opacity:.8;margin-top:16px;max-width:44ch}
.s-hero .cta{display:inline-flex;margin-top:28px;background:#C8247F;color:#fff;border-radius:999px;padding:12px 22px;font-weight:600}
.dev{width:min(220px,40vw);aspect-ratio:1/2;border-radius:36px;background:linear-gradient(160deg,#6B2E9A,#0E0712 62%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),0 40px 80px -30px rgba(200,36,127,.6);justify-self:center}
.s-grid{background:var(--page);padding-block:72px}
.s-grid h2,.s-text h2{font:700 clamp(26px,3.4vw,40px)/1.1 var(--f);letter-spacing:-.02em;margin-bottom:28px}
[dir="rtl"] .s-grid h2,[dir="rtl"] .s-text h2{letter-spacing:0}

.dsp .btn.sec{background:var(--action-secondary);color:var(--text-brand);box-shadow:inset 0 0 0 var(--stroke-default) var(--border-brand)} .dsp .btn.sec:hover{background:var(--action-secondary-hover)}

.dsp .band h2{font:var(--t-display-l);color:var(--text-on-gradient);max-width:18ch} .dsp .band p{font:var(--t-body-l);color:var(--text-on-gradient);margin-top:var(--space-md);max-width:52ch}

.bdg,[dir="rtl"] .bdg{font:var(--t-subtitle)}

.pop{width:360px}

.pop .who b{font:var(--t-h4)} .pop .who small{font:var(--t-body-m)}
.cnt{font:var(--t-label)}
.legal{font:var(--t-body-s)}

.sres a .path{font:var(--t-body-m)}

/* Dropdowns that end with a list: last option sits flush with the panel bottom and its
   hover fill follows the panel's Radius/Control corners. */

.zh[data-state="sticky"] .zh-bar{box-shadow:var(--elevation-1)}
}

/* Underline Tab spans the full header height (64): hover fill and underline sit edge to edge of the bar. */
@media (min-width:1150px){

.zh-nav li{display:flex}
.zh-t{height:100%}
}

/* =====================================================================================
   DESKTOP MOTION — styles driven by the spring engine (see M in the script)
   --p (0 → 1) is the continuous scroll progress set on #zh every frame while it moves.
   Every visual end state is unchanged (DS tokens); only the in-between is new.
   ===================================================================================== */
@media (min-width:1150px){
:root{--sh-a:.06} :root[data-theme="dark"]{--sh-a:.4}
/* header morph: context row slides away, glass + elevation fade in, logo eases to its compact size */
#zh,#zh[data-state="sticky"]{transition:none;transform:translateY(calc(var(--p,0) * -1 * var(--ctx-h)))}
#zh .zh-ctx,#zh[data-state="sticky"] .zh-ctx{transition:none;visibility:visible;opacity:clamp(0, calc(1 - var(--p,0) * 1.8), 1)}
#zh.ctx-off .zh-ctx{visibility:hidden}
#zh .zh-bar,#zh[data-state="sticky"] .zh-bar,#zh.panel-open .zh-bar,#zh.panel-open[data-state="sticky"] .zh-bar{
  transition:none;height:var(--bar-h);
  background:color-mix(in srgb,var(--surface-default) calc(100% - 24% * var(--p,0)),transparent);
  -webkit-backdrop-filter:saturate(calc(100% + 80% * var(--p,0))) blur(calc(20px * var(--p,0)));
  backdrop-filter:saturate(calc(100% + 80% * var(--p,0))) blur(calc(20px * var(--p,0)));
  box-shadow:0 1px 2px rgba(0,0,0,calc(var(--sh-a) * var(--p,0))),0 2px 6px rgba(0,0,0,calc(var(--sh-a) * var(--p,0)))}
#zh .logo .logo-img,#zh[data-state="sticky"] .logo .logo-img{width:120px;transition:none;transform:scale(calc(1 - .058 * var(--p,0)));transform-origin:left center}  /* 120 → 113 (DS minimum) */
[dir="rtl"] #zh .logo .logo-img{transform-origin:right center}
#zh .zh-panels,#zh[data-state="sticky"] .zh-panels{transition:none;
  background:color-mix(in srgb,var(--surface-default) calc(100% - 8% * var(--p,0)),transparent);
  -webkit-backdrop-filter:saturate(calc(100% + 80% * var(--p,0))) blur(calc(24px * var(--p,0)));
  backdrop-filter:saturate(calc(100% + 80% * var(--p,0))) blur(calc(24px * var(--p,0)))}
#zh .zh-panels{transition:box-shadow .3s cubic-bezier(.16,1,.3,1)}
/* one mega-menu container: panels are cross-faded by the engine, never by CSS */
#zh .mm,#zh .mm.on{transition:none}
#zh .mm.leaving{position:absolute;top:0;inset-inline:0;visibility:visible;opacity:1;pointer-events:none}
#zh .mm.on .mcol{animation:none}
/* sliding indicators replace per-item hover fill / underline (same DS tokens) */
#zh .zh-nav{position:relative}
#zh .zh-nav ul{position:relative;z-index:1}
#zh .zh-t:hover,#zh .zh-t[aria-expanded="true"]:hover{background:transparent}
#zh .zh-t::after{display:none}
.nav-hl{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--action-neutral-hover);opacity:0;pointer-events:none;transition:opacity .22s cubic-bezier(.16,1,.3,1);will-change:transform,width}
.nav-ul{position:absolute;bottom:0;left:0;width:0;height:var(--stroke-emphasis);background:var(--border-brand);opacity:0;pointer-events:none;z-index:2;transition:opacity .2s cubic-bezier(.16,1,.3,1);will-change:transform,width}
/* backdrop, dropdowns, search: same easing family */
#curtain{transition:opacity .36s cubic-bezier(.16,1,.3,1),visibility 0s linear .36s}
#curtain.on{transition:opacity .32s cubic-bezier(.16,1,.3,1),visibility 0s}
.pop{transform:translateY(-6px) scale(.97);transition:opacity .18s cubic-bezier(.16,1,.3,1),transform .34s cubic-bezier(.34,1.25,.64,1),visibility 0s linear .34s}
.pop.on{transform:none;transition:opacity .22s cubic-bezier(.16,1,.3,1),transform .4s cubic-bezier(.34,1.25,.64,1),visibility 0s}
#zh .search{transform:translateY(-8px);transition:opacity .2s cubic-bezier(.16,1,.3,1),transform .42s cubic-bezier(.16,1,.3,1),visibility 0s linear .42s}
#zh .search.on{transform:none;transition:opacity .24s cubic-bezier(.16,1,.3,1),transform .46s cubic-bezier(.16,1,.3,1),visibility 0s}
}
@media (min-width:1150px) and (prefers-reduced-motion:reduce){
.nav-hl,.nav-ul,#curtain,#curtain.on,.pop,.pop.on,#zh .search,#zh .search.on{transition:none!important}
.pop,#zh .search{transform:none}
}

/* =====================================================================================
   GLASS ONLY WHILE NOTHING IS OPEN
   --o eases 0 → 1 while a mega-menu (or search) is open; the glass amount is
   --gp = --p × (1 − --o), so the bar and panel turn solid Surface/Default while the user
   is in the menu and become glass again after it closes. The scroll morph (context row,
   logo, elevation) is unaffected.
   ===================================================================================== */
@property --o{syntax:'<number>';inherits:true;initial-value:0}
@media (min-width:1150px){
#zh{--o:0;--gp:calc(var(--p,0) * (1 - var(--o)));transition:--o .24s cubic-bezier(.16,1,.3,1)}
#zh.panel-open,#zh.search-open{--o:1}
#zh .zh-bar,#zh[data-state="sticky"] .zh-bar,#zh.panel-open .zh-bar,#zh.panel-open[data-state="sticky"] .zh-bar{
  background:color-mix(in srgb,var(--surface-default) calc(100% - 24% * var(--gp)),transparent);
  -webkit-backdrop-filter:saturate(calc(100% + 80% * var(--gp))) blur(calc(20px * var(--gp)));
  backdrop-filter:saturate(calc(100% + 80% * var(--gp))) blur(calc(20px * var(--gp)))}
#zh .zh-panels,#zh[data-state="sticky"] .zh-panels{
  background:color-mix(in srgb,var(--surface-default) calc(100% - 8% * var(--gp)),transparent);
  -webkit-backdrop-filter:saturate(calc(100% + 80% * var(--gp))) blur(calc(24px * var(--gp)));
  backdrop-filter:saturate(calc(100% + 80% * var(--gp))) blur(calc(24px * var(--gp)))}
#zh .search,#zh[data-state="sticky"] .search{background:var(--surface-default);-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (min-width:1150px) and (prefers-reduced-motion:reduce){#zh{transition:none}}

/* Header actions grouped: icons (Search · Cart) then buttons (Quick Pay · Log in).
   Gap inside a group = Space/sm (8); between groups = Space/xl (24). */
@media (min-width:1150px){
.zh-act{gap:var(--space-sm)}
.zh-act > .qp{margin-inline-start:var(--space-lg)}
}

/* Logo keeps its full size (120px) in every scroll state — no scale-down while scrolling. */
@media (min-width:1150px){
#zh .logo .logo-img,#zh[data-state="sticky"] .logo .logo-img{width:120px;transform:none}
}

/* Header is solid while the pointer is over it (or keyboard focus is inside it);
   glass returns when the pointer leaves. Uses the same eased --o cross-fade (240ms). */
@media (min-width:1150px){
#zh:hover,#zh:has(:focus-visible){--o:1}
}

/* Direct nav links (Support): hover matches the category tabs — Text/Primary + sliding Border/Brand underline. */
@media (min-width:1150px){
#zh .zh-nav a.zh-t:hover{color:var(--text-primary)}
}

/* Framer-like hover: highlight opacity/scale are spring-driven by the engine (no CSS cut);
   label colour cross-fades instead of switching. */
@media (min-width:1150px){
.nav-hl{transition:none;transform-origin:center}
#zh .zh-t{transition:color .28s cubic-bezier(.16,1,.3,1),background-color .28s cubic-bezier(.16,1,.3,1)}
.nav-ul{transition:opacity .3s cubic-bezier(.16,1,.3,1)}
}

/* FIX: the glass ↔ solid cross-fade must also run in the sticky (scrolled) state.
   Previously "#zh[data-state=sticky]{transition:none}" out-ranked it, so hover snapped to solid. */
@media (min-width:1150px){
#zh,#zh[data-state],#zh[data-state="sticky"],#zh[data-state="top"]{transition:--o .36s cubic-bezier(.16,1,.3,1)}
}
@media (min-width:1150px) and (prefers-reduced-motion:reduce){#zh,#zh[data-state],#zh[data-state="sticky"]{transition:none}}

/* =====================================================================================
   PAGE BODY (desktop) — background artwork only, swaps with the theme
   ===================================================================================== */
@media (min-width:1150px){
.bgpage{min-height:200vh;background:var(--surface-page) url("assets/bg/bg-light.png") top center / 100% auto no-repeat}
:root[data-theme="dark"] .bgpage{background-image:url("assets/bg/bg-dark.png")}
}

/* =====================================================================================
   LIQUID GLASS (desktop sticky bar) — per the user's reference video
   Clearer tint (Surface/Default ~42%), lighter blur, stronger saturation, a bright
   specular rim (inset highlights) and a soft lift shadow. Still driven by --gp, so it
   cross-fades to solid Surface/Default on hover / menu open as before.
   EXCEPTION: no DS glass token; built from Surface/Default + Grey-0 highlights.
   ===================================================================================== */
@media (min-width:1150px){
:root{--lg-tint:58%;--lg-blur:12px;--lg-sat:90%;--lg-bright:4%;--lg-rim:.85;--lg-rim2:.35;--lg-sh:.08}
:root[data-theme="dark"]{--lg-tint:62%;--lg-blur:14px;--lg-sat:60%;--lg-bright:-6%;--lg-rim:.22;--lg-rim2:.06;--lg-sh:.45}
#zh .zh-bar,#zh[data-state="sticky"] .zh-bar,#zh.panel-open .zh-bar,#zh.panel-open[data-state="sticky"] .zh-bar{
  background:
    linear-gradient(180deg,rgba(255,255,255,calc(.22 * var(--lg-rim) * var(--gp))) 0%,rgba(255,255,255,0) 55%),
    color-mix(in srgb,var(--surface-default) calc(100% - var(--lg-tint) * var(--gp)),transparent);
  -webkit-backdrop-filter:blur(calc(var(--lg-blur) * var(--gp))) saturate(calc(100% + var(--lg-sat) * var(--gp))) brightness(calc(100% + var(--lg-bright) * var(--gp)));
  backdrop-filter:blur(calc(var(--lg-blur) * var(--gp))) saturate(calc(100% + var(--lg-sat) * var(--gp))) brightness(calc(100% + var(--lg-bright) * var(--gp)));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,calc(var(--lg-rim) * var(--gp))),
    inset 0 -1px 0 rgba(255,255,255,calc(var(--lg-rim2) * var(--gp))),
    inset 0 -10px 18px -12px rgba(255,255,255,calc(var(--lg-rim) * .6 * var(--gp))),
    0 8px 24px rgba(0,0,0,calc(var(--lg-sh) * var(--p,0))),
    0 1px 2px rgba(0,0,0,calc(var(--lg-sh) * .6 * var(--p,0)))}
}

/* =====================================================================================
   FLOATING PILL (desktop) — as the page scrolls (--p 0 → 1) the full-width bar morphs
   into a floating liquid-glass pill: insets from the edges, drops 12px (Space/md) from
   the top, corners round to a full pill. The mega-menu / search open as a rounded card
   under the pill. At p = 0 everything is exactly the full-width header.
   --pm = pill gap from the viewport edge (wide screens: pill hugs the 1360 content).
   --pp = pill inner padding, so nav content barely moves.
   ===================================================================================== */
@media (min-width:1150px){
#zh{--pm:max(8px, var(--mx) - 24px, (100vw - var(--layout-content-max)) / 2 - 24px);--pp:max(20px, var(--mx) - var(--pm))}
#zh .zh-bar,#zh[data-state="sticky"] .zh-bar,#zh.panel-open .zh-bar,#zh.panel-open[data-state="sticky"] .zh-bar{
  margin-inline:calc(var(--p,0) * var(--pm));
  margin-top:calc(var(--p,0) * var(--space-md));
  border-radius:calc(var(--p,0) * var(--bar-h) / 2);

#zh .zh-in{padding-inline:calc(var(--mx) - var(--p,0) * (var(--mx) - var(--pp)))}
/* nav hover highlight + underline sit inside the pill — sharp edges (no radius), per review */
#zh .nav-hl{top:calc(var(--p,0) * 8px);bottom:calc(var(--p,0) * 8px);border-radius:0}
#zh .nav-ul{bottom:calc(var(--p,0) * 8px)}
/* mega-menu and search: rounded card under the pill */
#zh .zh-panels,#zh[data-state="sticky"] .zh-panels{

}

/* =====================================================================================
   SMOOTH FLOAT (desktop) — replaces the layout-animated pill above.
   Only cheap properties move per frame:
   • the whole header translates (GPU transform) up by the context row and down by 12px;
   • the glass surface is a ::before layer whose insets + radius change (absolute box,
     no reflow of the nav content); content padding is static, so labels never shift.
   --p is now driven by a spring toward 0 or 1 (see M.scroll), not by scroll position.
   ===================================================================================== */
@media (min-width:1150px){
#zh,#zh[data-state="sticky"]{transform:translate3d(0,calc(var(--p,0) * (var(--space-md) - var(--ctx-h))),0)}
#zh .zh-bar,#zh[data-state="sticky"] .zh-bar,#zh.panel-open .zh-bar,#zh.panel-open[data-state="sticky"] .zh-bar{
  margin:0;border-radius:0;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
#zh .zh-bar::before{content:"";position:absolute;top:0;bottom:0;inset-inline:calc(var(--p,0) * var(--pm));
  border-radius:calc(var(--p,0) * var(--bar-h) / 2);pointer-events:none;
  background:
    linear-gradient(180deg,rgba(255,255,255,calc(.22 * var(--lg-rim) * var(--gp))) 0%,rgba(255,255,255,0) 55%),
    color-mix(in srgb,var(--surface-default) calc(100% - var(--lg-tint) * var(--gp)),transparent);
  -webkit-backdrop-filter:blur(calc(var(--lg-blur) * var(--gp))) saturate(calc(100% + var(--lg-sat) * var(--gp))) brightness(calc(100% + var(--lg-bright) * var(--gp)));
  backdrop-filter:blur(calc(var(--lg-blur) * var(--gp))) saturate(calc(100% + var(--lg-sat) * var(--gp))) brightness(calc(100% + var(--lg-bright) * var(--gp)));
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,calc(var(--lg-rim2) * var(--gp))),
    inset 0 1px 0 rgba(255,255,255,calc(var(--lg-rim) * var(--gp))),
    inset 0 -10px 18px -12px rgba(255,255,255,calc(var(--lg-rim) * .6 * var(--gp))),
    0 0 0 1px rgba(0,0,0,calc(var(--lg-sh) * .5 * var(--p,0) * var(--o))),
    0 10px 30px rgba(0,0,0,calc(var(--lg-sh) * 1.4 * var(--p,0))),
    0 2px 6px rgba(0,0,0,calc(var(--lg-sh) * .8 * var(--p,0)))}
#zh .zh-in{position:relative;--zp:max(var(--mx), var(--pm) + 20px);padding-inline:var(--zp);max-width:calc(var(--layout-content-max) + 2 * var(--zp))}
#zh .zh-panels,#zh[data-state="sticky"] .zh-panels{top:calc(100% + var(--p,0) * var(--space-sm))}
}

/* =====================================================================================
   TRANSPARENT AT TOP (desktop) — at the top of the page the whole header (context row +
   bar) is transparent over the page artwork; when scrolled it floats as the glass pill.
   Fill amount --a = max(--p, --o): 0 at top, 1 when floating, and 1 on hover / menu open
   (so hovering or opening a menu still turns it solid, as agreed).
   The artwork is pulled up under the header so it shows through.
   ===================================================================================== */
@media (min-width:1150px){
#zh{--a:max(var(--p,0), var(--o))}
#zh .zh-bar::before{
  background:
    linear-gradient(180deg,rgba(255,255,255,calc(.22 * var(--lg-rim) * var(--gp))) 0%,rgba(255,255,255,0) 55%),
    color-mix(in srgb,var(--surface-default) calc((100% - var(--lg-tint) * var(--gp)) * var(--a)),transparent)}
#zh .zh-ctx,#zh[data-state="sticky"] .zh-ctx{
  background:color-mix(in srgb,var(--surface-default) calc(100% * var(--o)),transparent);
  border-bottom-color:color-mix(in srgb,var(--border-default) calc(100% * var(--o)),transparent)}
.bgpage{margin-top:calc(-1 * (var(--ctx-h) + var(--bar-h)))}
}

/* =====================================================================================
   LIGHT GLASS TUNING — make the light pill read like the dark one: see-through body,
   defined edge. White glass over a white page needs a darker edge to show its shape.
   ===================================================================================== */
@media (min-width:1150px){
:root{--lg-tint:74%;--lg-blur:8px;--lg-sat:60%;--lg-bright:0%;--lg-rim:.95;--lg-rim2:.6;--lg-sh:.07;--lg-edge:.10;--lg-depth:.06}
:root[data-theme="dark"]{--lg-edge:0;--lg-depth:0}
#zh .zh-bar::before{
  box-shadow:
    0 0 0 1px rgba(0,0,0,calc(var(--lg-edge) * var(--gp))),
    inset 0 0 0 1px rgba(255,255,255,calc(var(--lg-rim2) * var(--gp))),
    inset 0 1px 0 rgba(255,255,255,calc(var(--lg-rim) * var(--gp))),
    inset 0 -1px 0 rgba(0,0,0,calc(var(--lg-depth) * var(--gp))),
    inset 0 -10px 18px -12px rgba(255,255,255,calc(var(--lg-rim) * .6 * var(--gp))),
    0 0 0 1px rgba(0,0,0,calc(var(--lg-sh) * .5 * var(--p,0) * var(--o))),
    0 10px 30px rgba(0,0,0,calc(var(--lg-sh) * 1.4 * var(--p,0))),
    0 2px 6px rgba(0,0,0,calc(var(--lg-sh) * .8 * var(--p,0)))}
}

/* =====================================================================================
   COUNTRY DROPDOWN = DS "Select Options" · Platform=Web (545:1144) + "_Select/Option"
   with Show Icon = Icon/Flags/* (as in the DS Nationality example 834:1488).
   Panel: 200 wide (reduced from DS 361 per review) · pad 8/0 · Radius/Control · Surface/Default · 1px Border/Default · Elevation/2
   Search: frame pad 4/8/8/8 · Search Field h56 · pad 0/16 · gap 8 (Space/sm) · Radius/Control ·
           Surface/Muted · Icon/General/Search 24 · Body L hint in Text/Secondary
   Option: h48 · pad 0/16 (Space/lg) · gap 12 (Space/md) · flag 24 · Body L Text/Primary
           Selected = Bold + Check 24 (Icon/Brand) · Highlighted = Surface/Muted

@media (min-width:1150px){

.pop.ctry > div.sel-search:not(.btns){margin:0;padding:var(--space-xs) var(--space-sm) var(--space-sm)}
.sel-sf{display:flex;align-items:center;height:56px;padding:0 var(--space-lg);gap:var(--space-sm);background:var(--surface-muted);border-radius:var(--radius-control);cursor:text}
.sel-sf:focus-within{box-shadow:var(--focus-ring)}
.sel-sf .ic{width:24px;height:24px;flex:none;color:var(--icon-default)}
.sel-sf input{flex:1;min-width:0;height:100%;border:0;background:none;padding:0;font:var(--t-body-l);color:var(--text-primary);outline:none}
.sel-sf input:focus-visible{box-shadow:none}
.sel-sf input::placeholder{color:var(--text-secondary);opacity:1}

.pop.ctry .list button{height:48px;padding:0 var(--space-lg);gap:var(--space-md);justify-content:flex-start;font:var(--t-body-l);color:var(--text-primary)}

.pop.ctry .list button[aria-current="true"] .ic{width:24px;height:24px;flex:none;color:var(--icon-brand)}
.pop.ctry .list li > button::after{display:none}
.pop.ctry .list li:not([hidden]) ~ li:not([hidden]) > button::before{content:"";position:absolute;inset-inline:var(--space-lg);top:0;height:var(--stroke-default);background:var(--border-default)}
.pop.ctry .sel-empty{margin:0;padding:var(--space-md) var(--space-lg);font:var(--t-body-l);color:var(--text-secondary)}

/* =====================================================================================
   FIGMA GLASS (desktop floating pill) — PlayGround 319:24590 "Glass" effect.
   Two layers behind the nav content:
   ::before = solid Surface/Default (top-of-page hover / menu open) + drop shadow
   ::after  = the glass: --lg-fill (Figma 2026-11-09: dark = black 30%, light = white 30%), refraction + dispersion filter (#zglass),
              light −45° rim at intensity .8; shown at opacity --gp (cross-fades with solid).
   ===================================================================================== */
@media (min-width:1150px){
.zh-probe{position:absolute;left:0;top:0;height:0;width:calc(100% - 2 * var(--pm));visibility:hidden;pointer-events:none}
#zh .zh-in{z-index:1}
#zh .zh-bar::before{
  background:color-mix(in srgb,var(--surface-default) calc(100% * var(--a) * (1 - var(--gp))),transparent);
  -webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:
    0 0 0 1px rgba(0,0,0,calc(var(--lg-sh) * .5 * var(--p,0) * var(--o))),
    0 10px 30px rgba(0,0,0,calc(var(--lg-sh) * 1.4 * var(--p,0))),
    0 2px 6px rgba(0,0,0,calc(var(--lg-sh) * .8 * var(--p,0)))}
#zh .zh-bar::after{content:"";position:absolute;top:0;bottom:0;inset-inline:calc(var(--p,0) * var(--pm));z-index:0;
  border-radius:calc(var(--p,0) * var(--bar-h) / 2);pointer-events:none;opacity:var(--gp);
  background:var(--lg-fill);
  -webkit-backdrop-filter:blur(4px) saturate(140%);backdrop-filter:blur(4px) saturate(140%);
  box-shadow:
    0 0 0 .5px rgba(0,0,0,var(--lg-edge)),
    inset 1px 1px 0 rgba(255,255,255,calc(.8 * var(--lg-lit))),
    inset -1px -1px 0 rgba(255,255,255,calc(.45 * var(--lg-lit))),
    inset 8px 8px 16px -12px rgba(255,255,255,calc(.5 * var(--lg-lit))),
    inset -8px -8px 16px -12px rgba(255,255,255,calc(.3 * var(--lg-lit)))}
:root.lg-svg #zh .zh-bar::after{-webkit-backdrop-filter:url(#zglass);backdrop-filter:url(#zglass)}
:root{--lg-lit:1;--lg-edge:.10;--lg-fill:rgba(255,255,255,.30)} :root[data-theme="dark"]{--lg-lit:.8;--lg-edge:0;--lg-fill:rgba(0,0,0,.30)}
}

/* Firefox / Safari glass: mirrored artwork + lens filter on an element (filter:url() is cross-browser) */
@media (min-width:1150px){
.zh-glass{display:none}
:root.lg-mirror #zh .zh-glass{display:block;position:absolute;top:0;bottom:0;inset-inline:calc(var(--p,0) * var(--pm));z-index:0;
  border-radius:calc(var(--p,0) * var(--bar-h) / 2);overflow:hidden;opacity:var(--gp);pointer-events:none;isolation:isolate}
:root.lg-mirror #zh .zh-glass-f{position:absolute;inset:0;filter:url(#zglass)}
:root.lg-mirror #zh .zh-glass-bg{position:absolute;left:0;top:0;will-change:transform;
  background:var(--surface-page) url("assets/bg/bg-light.png") top center / 100% auto no-repeat}
:root.lg-mirror[data-theme="dark"] #zh .zh-glass-bg{background-image:url("assets/bg/bg-dark.png")}
:root.lg-mirror #zh .zh-bar::after{-webkit-backdrop-filter:none;backdrop-filter:none}
}
/* Safari glass: canvas-computed lens (same layer box as the Firefox path) */
@media (min-width:1150px){
:root.lg-canvas #zh .zh-glass{display:block;position:absolute;top:0;bottom:0;inset-inline:calc(var(--p,0) * var(--pm));z-index:0;
  border-radius:calc(var(--p,0) * var(--bar-h) / 2);overflow:hidden;opacity:var(--gp);pointer-events:none;-webkit-mask-image:-webkit-radial-gradient(white,black)}
:root.lg-canvas #zh .zh-glass-c{position:absolute;inset:0;width:100%;height:100%;display:block}
:root.lg-canvas #zh .zh-bar::after{-webkit-backdrop-filter:none;backdrop-filter:none}
}

/* =====================================================================================
   FAST + SMOOTH FLOAT — the heavy glass layer no longer changes size during the morph.
   It sits at the final pill geometry and only fades/scales in (opacity + transform =
   compositor-only), so the refraction filter / canvas never re-renders at odd sizes.
   Only the light solid layer (::before) morphs its shape.
   ===================================================================================== */
@media (min-width:1150px){
#zh .zh-bar::after,
:root.lg-mirror #zh .zh-glass,
:root.lg-canvas #zh .zh-glass{inset-inline:var(--pm);border-radius:calc(var(--bar-h) / 2);
  transform:scale(calc(.97 + .03 * var(--gp)));transform-origin:50% 50%;will-change:opacity,transform}
}

/* =====================================================================================
   FAST HOVER CROSS-FADE (glass ↔ solid) — 160ms in / 220ms out, ease-out.
   The solid layer no longer re-colours per frame: it is plain Surface/Default and only its
   OPACITY changes (compositor-only), like the glass layer. Same --a / --gp logic as before.
   ===================================================================================== */
@media (min-width:1150px){
#zh,#zh[data-state],#zh[data-state="sticky"],#zh[data-state="top"]{transition:--o .22s cubic-bezier(.2,.8,.2,1)}
#zh:hover,#zh:has(:focus-visible),#zh.panel-open,#zh.search-open{transition:--o .16s cubic-bezier(.2,.8,.2,1)}
#zh .zh-bar::before{background:var(--surface-default);opacity:calc(var(--a) * (1 - var(--gp)));will-change:opacity}
/* the solid layer now fades with opacity, so the glass layer carries the same lift shadow */
#zh .zh-bar::after{box-shadow:
    0 0 0 .5px rgba(0,0,0,var(--lg-edge)),
    0 10px 30px rgba(0,0,0,calc(var(--lg-sh) * 1.4)),
    0 2px 6px rgba(0,0,0,calc(var(--lg-sh) * .8)),
    inset 1px 1px 0 rgba(255,255,255,calc(.8 * var(--lg-lit))),
    inset -1px -1px 0 rgba(255,255,255,calc(.45 * var(--lg-lit))),
    inset 8px 8px 16px -12px rgba(255,255,255,calc(.5 * var(--lg-lit))),
    inset -8px -8px 16px -12px rgba(255,255,255,calc(.3 * var(--lg-lit)))}
}
@media (min-width:1150px) and (prefers-reduced-motion:reduce){#zh,#zh:hover{transition:none}}

/* ── context row: breathing room above Personal/Business (review) ──
   Row grows 40 → 48 (Spacing/48); the extra 8 (Space/sm) goes on top only. */
@media (min-width:1150px){
  /* equal top/bottom: 8 + Tab Group 40 + 8 (+1px divider) */
  :root{--ctx-h:calc(var(--spacing-40) + 2 * var(--space-sm) + var(--stroke-default))}
  .zh-ctx{padding-block:var(--space-sm)}
}

/* ── Quick Pay + Log in / account: pill shape (review) ── */
@media (min-width:1150px){
  .qp,.acct,.acct.in{border-radius:var(--radius-pill)}
}

/* ── Pill edge gap = button's vertical gap (review) ──
   --pg = (Bar 64 − Button/L 48) / 2 = 8. The pill edge sits exactly --pg outside the content box,
   so Log in's end gap = its top/bottom gap, and the logo's start gap matches it. Content doesn't move. */
@media (min-width:1150px){
  #zh{--pg:calc((var(--bar-h) - var(--btn-h-l)) / 2);
      --pm:max(8px, var(--mx) - var(--pg), (100vw - var(--layout-content-max)) / 2 - var(--pg))}
  #zh .zh-in{--zp:max(var(--mx), var(--pm) + var(--pg))}
}

/* ── Logo side reverted (review): pill START edge back to the original 24px from the content
   (--pms = the pre-change --pm); END edge keeps the 8px gap (= Log in's top/bottom gap).
   Content doesn't move; only the pill's start edge shifts outward. RTL-safe (logical insets). ── */
@media (min-width:1150px){
  #zh{--pms:max(8px, var(--mx) - 24px, (100vw - var(--layout-content-max)) / 2 - 24px)}
  #zh .zh-bar::before{inset-inline-start:calc(var(--p,0) * var(--pms));inset-inline-end:calc(var(--p,0) * var(--pm))}
  #zh .zh-bar::after,
  :root.lg-mirror #zh .zh-glass,
  :root.lg-canvas #zh .zh-glass{inset-inline-start:var(--pms);inset-inline-end:var(--pm)}
  .zh-probe{width:calc(100% - var(--pms) - var(--pm))}
  #zh .zh-panels,#zh[data-state="sticky"] .zh-panels{inset-inline-start:calc(var(--p,0) * var(--pms));inset-inline-end:calc(var(--p,0) * var(--pm))}
  #zh .search,#zh[data-state="sticky"] .search{margin-inline-start:calc(var(--p,0) * var(--pms));margin-inline-end:calc(var(--p,0) * var(--pm))}
}

/* ── Personal/Business: sliding thumb v2 (spring, Framer layoutId-style) ──
   Pill sits ABOVE the base labels and carries its own white copy of them, clipped to its shape,
   so the label colour switches exactly at the pill edge while it moves. */
.seg.has-thumb{position:relative;isolation:isolate}
.seg.has-thumb button,.seg.has-thumb button[aria-pressed="true"],:root[data-theme="dark"] .seg.has-thumb button[aria-pressed="true"]{
  position:relative;z-index:1;background:transparent;color:var(--text-primary);transition:none} /* no bg fade: a fresh render must never flash a second pill */
.seg.has-thumb button:hover,.seg.has-thumb button:active{background:transparent} /* no hover fill on the unselected option (review) */
.seg.has-thumb button[aria-pressed="true"]:hover{background:transparent}
.seg-thumb{position:absolute;left:0;z-index:2;overflow:hidden;border-radius:var(--radius-pill);background:var(--action-primary);
  pointer-events:none;will-change:transform,width;contain:layout paint}
.seg-thumb-in{position:absolute;left:0;will-change:transform}
.seg-cl{position:absolute;display:flex;align-items:center;justify-content:center;white-space:nowrap;color:var(--text-on-brand)}
.seg.has-thumb button:focus-visible{z-index:3}

/* ── Country dropdown: stands out from the header in both themes (review) ──
   Dark mode can't separate layers with shadow alone (dark-on-dark), so the panel is RAISED one
   surface step (lighter = closer, the standard dark-elevation rule), gets a crisp 1px rim + top
   highlight, and a deeper shadow. Light keeps white but gets a firmer Elevation/3. */
@media (min-width:1150px){
  .pop.ctry{box-shadow:inset 0 0 0 var(--stroke-default) var(--border-default),var(--elevation-3)}
  :root[data-theme="dark"] .pop.ctry{
    background:var(--surface-muted);                                   /* grey-700: one step above the header's grey-800 */
    box-shadow:inset 0 0 0 var(--stroke-default) var(--p-grey-600),     /* rim */
               inset 0 1px 0 rgba(255,255,255,.06),                     /* top light edge */
               0 2px 6px rgba(0,0,0,.45),0 16px 40px rgba(0,0,0,.6)}    /* lift */
  :root[data-theme="dark"] .pop.ctry .list li:not([hidden]) ~ li:not([hidden]) > button::before{background:var(--p-grey-600)}
  :root[data-theme="dark"] .pop.ctry .list button:hover,
  :root[data-theme="dark"] .pop.ctry .list button:focus-visible{background:var(--p-grey-600)}
}

/* ── Select-field chevron flips up while its list is open (review) — spring-ish ease ── */
.zh-ctx .cbtn[data-pop] > :last-child{transition:transform .32s cubic-bezier(.34,1.3,.64,1)}
.zh-ctx .cbtn[data-pop][aria-expanded="true"] > :last-child{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.zh-ctx .cbtn[data-pop] > :last-child{transition:none}}

/* =====================================================================================
   SMOOTH HOVER (glass → solid), Framer-style — fixes from the 2:09 PM recording:
   1. No double edge: the glass layer no longer shrinks when it fades (its 97→100% scale is
      tied to the scroll float --p only, never to hover).
   2. No see-through dip: the SOLID layer now sits ABOVE the glass and simply fades in over it
      (opacity --o). Glass stays fully on underneath, so every in-between frame is a clean
      blend of the two (solid·o + glass·(1−o)) instead of two half-transparent layers.
   3. Softer timing: 0.30s in / 0.38s out on an ease-out-quint curve.
   ===================================================================================== */
@media (min-width:1150px){
#zh,#zh[data-state],#zh[data-state="sticky"],#zh[data-state="top"]{transition:--o .38s cubic-bezier(.22,1,.36,1)}
#zh:hover,#zh:has(:focus-visible),#zh.panel-open,#zh.search-open{transition:--o .3s cubic-bezier(.22,1,.36,1)}
#zh .zh-in{z-index:2}
#zh .zh-bar::before{z-index:1;opacity:var(--o)}
#zh .zh-bar::after,
:root.lg-mirror #zh .zh-glass,
:root.lg-canvas #zh .zh-glass{opacity:var(--p,0);transform:scale(calc(.97 + .03 * var(--p,0)))}
}

/* ── Dark pill rim softer (review): light-edge strength .8 → .3 ── */
@media (min-width:1150px){ :root[data-theme="dark"]{--lg-lit:.3} }

/* ── Nav hover highlight: SHARP, full bar height, identical in every state (review) ──
   Same look as the full-width header hover (no radius, top→bottom of the bar), also when the
   header floats as a pill. The brand underline sits on the bar's bottom edge in both states. */
@media (min-width:1150px){
  #zh .nav-hl{top:0;bottom:0;border-radius:0}
  #zh .nav-ul{bottom:0}
}

/* ── Mega-menu link descriptions (MOCK copy) — one line of Body M / Text Secondary under the title ── */
.ds-desc{display:none}
@media (min-width:1150px){
  .grp a.has-desc,[dir="rtl"] .grp a.has-desc{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-xs);background:none}

/* =========================================================================

   from PlayGround node 319:24590: frost 8 · refraction 1 · depth 32 · light −45° ·
   intensity 0.8 · dispersion 0.5 · fill white 10%.
   A displacement map is generated for the pill size (capsule SDF, 32px refraction
   depth) and used by an SVG filter as the bar's backdrop-filter. Dispersion = the
   R/G/B channels are displaced by slightly different amounts. Chromium only

function glassMap(W, H) {

  const x2 = c.getContext('2d'), img = x2.createImageData(W, H), d = img.data, r = H / 2, D = GLASS.depth;

    const dist = r - len;                               // distance inside the capsule edge
    let vx = 0, vy = 0;
    if (dist >= 0 && dist < D) {

      const m = (1 - Math.sqrt(1 - t * t)) * GLASS.refraction;   // circular lens profile: steep at the rim
      vx = -dx / len * m; vy = -dy / len * m;           // sample toward the centre (lens bends content inward)

}

function updateGlass() {

  let probe = bar.querySelector('.zh-probe');

  const W = Math.round(probe.getBoundingClientRect().width), H = Math.round(bar.getBoundingClientRect().height);
  if (!W || !H || W + 'x' + H === glassKey) return; glassKey = W + 'x' + H;

function maxBand(){
  const t = MAX_BAND[L()] || MAX_BAND.en, d = DSI.tv, ar = L()==='ar';
  const tv = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-ds-icon="${esc(d.name)}">${d.svg}</svg>`;
  return `<div class="mm-sw mm-max" data-mock="true"><div class="mm-sw-in">
    <span class="sw-ic">${tv}</span>
    <div class="sw-tx"><h3 class="sw-h">${esc(t.h)}</h3><p class="sw-b">${esc(t.b1)} <span class="mx-stack" role="img" aria-label="${esc(t.sr)}">${MAXSTACK}</span> ${esc(t.b2)}</p></div>
    <a class="sw-cta" href="https://www.kw.zain.com/${ar?'ar':'en'}/shop/max" data-proto="link"><span>${esc(t.cta)}</span>${ic('arrow')}</a></div></div>`;
}
function panelHTML(c){
  const groups = GROUP_EDIT[c.id] ? GROUP_EDIT[c.id](c.groups) : c.groups;
  const prim = groups.filter(g => g.primary), sec = groups.filter(g => !g.primary).concat(EXTRA_GROUPS_MOCK[c.id] || []);
  const cols = []; const tracks = [];
  prim.forEach(g => { const n = g.links.length; const kind = n > 7 ? 'med' : 'big'; cols.push(`<div class="mcol">${groupHTML(g, kind)}</div>`); tracks.push(kind==='med' ? 'minmax(300px,2fr)' : 'minmax(236px,1.35fr)'); });
  let stack = [], n = 0;
  const flush = () => { if (stack.length) { cols.push(`<div class="mcol">${stack.join('')}</div>`); tracks.push('minmax(140px,1fr)'); } stack = []; n = 0; };
  sec.forEach(g => { const c2 = g.links.length; if (n && (g.newCol || n + c2 > 11)) flush(); stack.push(groupHTML(g, '')); n += c2 + 2; });
  if (c.more) stack.push(groupHTML({en:'More', ar:'المزيد', arProposed:true, links:c.more}, 'more'));
  flush();
  // featured area
  const ctx = PROMO_CTX[c.id];
  let feat = '';
  if (ctx && S.seg==='personal') {
    const r = resolveOffers(ctx);
    if (ctx==='hub') {
      const hint = S.persona!=='in' ? `<div class="hint">${ic('sparkle')}${u('guestOffers')}</div>` : (r.kind!=='cvm' ? `<div class="hint">${u('noPersonal')}</div>` : '');
      if (r.items.length || hint) feat = `<div class="feat" data-slot="${ctx}">${hint}<div class="hubgrid">${r.slow ? skelCard()+skelCard() : r.items.slice(0,3).map(x=>offerCard(x,true)).join('')}</div></div>`;
      if (r.items.length || hint) tracks.push('minmax(480px,2.6fr)');
    } else if (S.persona!=='in' && MOCK.guest[ctx] && S.offers!=='none') {
      // Guest: two stacked offers (CVM content) in the standard offer-card style
      const ph = MOCK.guest[ctx].some(x=>x.plan) ? `<div class="grp feat-hd"><h3>${headIc('best-selling internet plans')}${L()==='ar'?'باقات الإنترنت الأكثر مبيعاً':'Best-selling internet plans'}</h3></div>` : '';   // heading above the plan cards
      feat = `<div class="feat gbs" data-slot="${ctx}">${ph}${r.slow ? skelCard()+skelCard() : MOCK.guest[ctx].map(x=>x.plan?planCard(x):offerCard(x,true)).join('')}</div>`;
      tracks.push('minmax(260px,1.3fr)');
    } else if (r.items.length) {
      feat = `<div class="feat" data-slot="${ctx}">${r.slow ? skelCard() : offerCard(r.items[0])}</div>`;
      tracks.push('minmax(240px,1.3fr)');
    }
  }
  cols.forEach((_,i) => cols[i] = cols[i].replace('<div class="mcol">', `<div class="mcol" style="--i:${i}">`));
  const sw = (c.id==='mobile' && S.seg==='personal' && S.persona!=='in') ? switchBand()
           : (c.id==='entertainment' && S.seg==='personal') ? maxBand() : '';
  return `<div class="mm" id="p-${c.id}" role="region" aria-labelledby="t-${c.id}" data-cat="${c.id}"><div class="mm-in" style="grid-template-columns:${tracks.join(' ')}">${cols.join('')}${feat}</div>${sw}</div>`;
}
function renderPanels(){ $('#zh-panels').innerHTML = menuCats().map(panelHTML).join(''); }

/* ---------- mega-menu behaviour ---------- */

/* =========================================================================
   DESKTOP MOTION (≥1150px) — spring physics + Web Animations API
   • Spring: semi-implicit Euler with 4ms sub-steps; interruptible (keeps velocity).
   • Scroll: one continuous progress value --p (0 → 1 over 56px) drives the header morph.
   • Mega-menu: one container; height springs, content cross-fades directionally,
     columns/headings/links stagger in; sliding hover + active indicators.
   • prefers-reduced-motion: springs jump to their targets, no stagger or slides.
   ========================================================================= */
class Spring {
  constructor(v, o={}) { this.v = v; this.t = v; this.vel = 0; this.k = o.k ?? 420; this.c = o.c ?? 40; this.eps = o.eps ?? 0.02; this.cbs = []; this.raf = 0; this.step = this.step.bind(this); }
  on(fn) { this.cbs.push(fn); return this; }
  emit(done) { for (const f of this.cbs) f(this.v, done); }
  set(v) { cancelAnimationFrame(this.raf); this.raf = 0; this.v = this.t = v; this.vel = 0; this.emit(true); }

/* =========================================================================
   SCROLL — sticky glass (desktop + mobile), hide-on-scroll (mobile, optional)
   ========================================================================= */
let lastY = 0, ticking = false, revealUntil = 0;
function onScroll(){
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const y = window.scrollY, zh = $('#zh');
    const st = zh.dataset.state;
    const next = y >= 24 ? 'sticky' : (y < 8 ? 'top' : st);   // hysteresis
    if (next !== st) zh.dataset.state = next;
    if (!isMobile()) M.scroll(y);
    // the top row (country, etc.) slides away when the header floats — close its dropdown instead of
    // letting it ride up behind the pill and reappear clipped on the way back
    if (!isMobile() && y > 40 && UIS.pop && UIS.popBtn?.closest('.zh-ctx')) closePop(false);
    if (isMobile() && S.mhide==='on') {
      const kbFocusInHeader = zh.contains(document.activeElement) && document.activeElement.matches(':focus-visible');
      const guard = UIS.m || UIS.search || UIS.pop || kbFocusInHeader || performance.now() < revealUntil;
      const dy = y - lastY;
      if (guard || y < 400) zh.classList.remove('hidden');
      else if (dy > 8) zh.classList.add('hidden');
      else if (dy < -6) zh.classList.remove('hidden');
    } else zh.classList.remove('hidden');
    if (Math.abs(y - lastY) > 4) lastY = y;
  });
}

document.addEventListener('click', e => {
  const el = e.target.closest('button, a'); if (!el) {
    return;
  }
  // demo panel
  if (el.dataset.demo) { setState(el.dataset.demo, el.dataset.v); return; }
  if (el.dataset.pb) {
    if (el.dataset.pb === 'theme') { setState('theme', el.dataset.v); return; }
    const v = el.dataset.v;   // Guest → logged out · Logged in → persona in + not CVM eligible · CVM → persona in + eligible
    const next = v === 'guest' ? {persona:'out'} : {persona:'in', cvm: v === 'in-cvm' ? 'yes' : 'no'};
    Object.assign(S, next); applyAll(false); return;
  }
  const act = el.dataset.act;
  if (el.closest('#demo') || el.closest('#preview') || el.closest('#demo-dock') || el.closest('#pbar') || el.id === 'demo-tab') {
    if (el.id === 'demo-tab' || el.dataset.act === 'demo-open') { const d = $('#demo'); const on = !d.classList.contains('on'); d.classList.toggle('on', on); el.setAttribute('aria-expanded', on); if (on) d.querySelector('button')?.focus(); }
    if (act === 'demo-close') { $('#demo').classList.remove('on'); $('#demo-tab').setAttribute('aria-expanded','false'); (isMobile() ? $('#demo-tab') : $('#demo-dock .open'))?.focus(); }
    $('#demo-dock .open')?.setAttribute('aria-expanded', $('#demo').classList.contains('on'));
    $('#pbar .ctl')?.setAttribute('aria-expanded', $('#demo').classList.contains('on'));
    if (act === 'reset') { Object.assign(S, DEF); UIS.cartTouched = false; applyAll(true); }
    if (act === 'preview') openPreview(+el.dataset.w, +el.dataset.h);
    if (act === 'preview-close') { $('#preview').classList.remove('on'); $('#preview').innerHTML = ''; }
    return;
  }
  // mega triggers
  if (el.dataset.panel) { e.preventDefault(); onTriggerClick(el); return; }
  // popovers
  if (el.dataset.pop) { e.preventDefault(); openPop(el.dataset.pop, el, {focus: e.detail === 0}); return; }
  // internal cross-links (e.g. "Entertainment add-ons")
  if (el.dataset.goto) { e.preventDefault(); if (UIS.m) selectMCat(el.dataset.goto, {focus:true}); else openPanel(el.dataset.goto, {focus: e.detail===0}); return; }
  switch (act) {

    case 'search': e.preventDefault(); if (UIS.search) closeSearch(); else openSearch(el); return;
    case 'search-close': closeSearch(); return;
    case 'mopen': openM(e.detail === 0); return;
    case 'mclose': closeM(); return;

    case 'mctry': toggleMCtry(); return;
    case 'country': {
      const c = SRC.countries[+el.dataset.i]; closePop(); toggleMCtry(false);
      if (+el.dataset.i === 0) return;
      toast(`<div>${esc(ctryName(c))}<small>${esc(c.href[L()] || c.href.en)}</small></div><a href="${esc(c.href[L()] || c.href.en)}" target="_blank" rel="noopener">Open ↗</a>`); return; }
    case 'wishlist': closePop(); toast(S.persona==='in' ? `<div>${uPlain('wishlist')} · 3 <span class="mock">MOCK</span><small>Proposed: wishlist lives in the account menu</small></div>` : `<div>${uPlain('wishlist')}<small>Verified live behaviour: guests are sent to login</small></div>`); return;
    case 'logout': closePop(); setState('persona','out'); toast(`<div>Logged out (prototype)</div>`); return;
    case 'goto-offers': closePop(); if (isMobile()) { openM(); selectMCat('offers'); } else openPanel('offers', {focus:true}); return;
  }
  // category pill
  if (el.dataset.mcat) { selectMCat(el.dataset.mcat); return; }
  if (el.matches('.dsp .chip')) { el.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === el)); return; }
  // any navigation link → show destination (prototype); modifier-click opens for real
  if (el.matches('a[data-proto]')) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
    e.preventDefault();
    const kind = el.dataset.proto, href = el.getAttribute('href');
    if (kind === 'login') { toast(`<div>Would open Zain login<small>${esc(href)}</small></div><button type="button" data-demo="persona" data-v="in">Simulate log in</button>`); closePop(); return; }
    if (kind === 'mockonly') { toast(`<div>Sample content, not part of the navigation prototype</div>`); return; }
    const label = el.querySelector('h4')?.textContent || el.textContent.trim().replace(/\s+/g,' ');

    closePanel(); closePop(); if (UIS.search) closeSearch(false);
  }
});

});
document.addEventListener('input', e => { if (e.target.id === 'sq') runSearch(e.target.value); });
document.addEventListener('focusin', e => { if (isMobile() && $('#zh').contains(e.target) && e.target.matches(':focus-visible')) $('#zh').classList.remove('hidden'); });
window.addEventListener('scroll', onScroll, {passive:true});
MQ.addEventListener('change', () => { closePanel(); closePop(); closeSearch(false); if (!isMobile()) closeM(false); renderAll(); onScroll(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme==='system') applyTheme(true); });
window.addEventListener('resize', () => { if (UIS.panel) { if (isMobile()) $('#zh-panels').style.height = $('#p-'+UIS.panel).offsetHeight + 'px'; else M.resize(); } railFades(); }, {passive:true});

/* QA helper (console): counts rendered links per surface for the current segment */
window.__znQA = () => {
  const d = new Set($$('#zh-panels [data-key]').map(a=>a.dataset.key).filter(k=>!k.startsWith('x:')));
  const m = new Set($$('#mnav [data-key]').map(a=>a.dataset.key));
  return {segment:S.seg, desktopPanelLinks:d.size, mobileMenuLinks: UIS.m||$('#mnav').innerHTML ? m.size : 'open the menu first', expected: S.seg==='business'?19:65};
};

bindMega();
applyAll(false);
onScroll();
})();
